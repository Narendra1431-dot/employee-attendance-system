<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Attendance Intel</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="auth-page">
    <!-- Animated Background -->
    <div class="login-background">
        <div class="floating-shapes">
            <div class="shape shape-1">🚀</div>
            <div class="shape shape-2">⚡</div>
            <div class="shape shape-3">🎯</div>
            <div class="shape shape-4">💼</div>
            <div class="shape shape-5">📊</div>
            <div class="shape shape-6">⏰</div>
        </div>
    </div>

    <div class="glass-container auth-card">
        <div class="auth-header">
            <h1 class="gradient-text">
                <i class="fas fa-rocket"></i> Attendance<span>Intel</span> <i class="fas fa-bolt"></i>
            </h1>
            <p id="auth-subtitle" class="fade-in" style="color: var(--text-muted); margin-top: 10px;">Sign in to your account</p>
        </div>

        <form id="login-form" class="animate-form">
            <div class="form-group">
                <label>
                    <i class="fas fa-envelope"></i> Email Address
                </label>
                <input type="email" id="email" required placeholder="name@company.com" class="input-glow">
            </div>
            <div class="form-group">
                <label>
                    <i class="fas fa-lock"></i> Password
                </label>
                <input type="password" id="password" required placeholder="••••••••" class="input-glow">
            </div>
            <button type="submit" class="btn btn-primary btn-animated" style="width: 100%; justify-content: center;">
                <i class="fas fa-sign-in-alt"></i> Sign In
            </button>
        </form>

        <form id="register-form" style="display: none;" class="animate-form">
            <div class="form-group">
                <label>
                    <i class="fas fa-user"></i> Full Name
                </label>
                <input type="text" id="reg-name" required placeholder="John Doe" class="input-glow">
            </div>
            <div class="form-group">
                <label>
                    <i class="fas fa-envelope"></i> Email Address
                </label>
                <input type="email" id="reg-email" required placeholder="name@company.com" class="input-glow">
            </div>
            <div class="form-group">
                <label>
                    <i class="fas fa-lock"></i> Password
                </label>
                <input type="password" id="reg-password" required placeholder="••••••••" class="input-glow">
            </div>
            <div class="form-group">
                <label>
                    <i class="fas fa-user-tag"></i> Role
                </label>
                <select id="reg-role" class="input-glow">
                    <option value="EMPLOYEE">👨‍💼 Employee</option>
                    <option value="MANAGER">👔 Manager</option>
                    <option value="ADMIN">⚡ Administrator</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary btn-animated" style="width: 100%; justify-content: center;">
                <i class="fas fa-user-plus"></i> Create Account
            </button>
        </form>

        <div style="text-align: center; margin-top: 24px;">
            <a href="#" id="toggle-auth" style="color: var(--primary); text-decoration: none; font-size: 0.9rem;" class="btn-animated">
                <i class="fas fa-exchange-alt"></i> Don't have an account? Register here
            </a>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>

</html>
